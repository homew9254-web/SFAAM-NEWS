<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Search &mdash; SFAAM NEWS</title>
<meta name="description" content="Search news articles on SFAAM NEWS. Find breaking news from around the world."/>
<!-- V32.1: Search results pages should NOT be indexed by Google.
     Reasoning: search-result URLs have query-string parameters that
     create infinite URL space (every query = new URL). Indexing them
     dilutes crawl budget and produces thin-content pages in Google's
     index. The rel="noindex" tells Google to drop them. -->
<meta name="robots" content="noindex, follow"/>
<meta name="theme-color" content="#CA6D4C"/>
<meta name="msapplication-TileColor" content="#D97757"/>
<link rel="icon" type="image/png" href="/logo.png"/>
<link rel="apple-touch-icon" href="/logo.png"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
<link rel="canonical" href="https://sfaamnews.com/search.html"/>
</head>
<body>
<a href="#main-content" class="skip-nav">Skip to main content</a>
<div id="headerWrap"></div>
<div id="navWrap"></div>

<main class="main-content" id="main-content" style="padding-top:32px;">
  <h1 class="section-title">&#128269; Search News</h1>
  <div class="search-bar" style="max-width:600px;margin:0 0 32px 0;">
    <input type="text" id="searchBox" placeholder="Search articles..." style="background:var(--bg-3);color:var(--text);" onkeydown="if(event.key==='Enter')doSearchNow()" aria-label="Search articles"/>
    <span class="search-icon" onclick="doSearchNow()" role="button" tabindex="0" aria-label="Search" onkeydown="if(event.key==='Enter')doSearchNow()">&#128269;</span>
  </div>
  <div id="resultCount" style="color:var(--text-muted);margin-bottom:20px;font-size:14px;"></div>
  <div class="news-grid" id="resultsGrid">
    <div class="news-card" style="grid-column:1/-1;padding:60px;text-align:center;">
      <div style="font-size:3rem;margin-bottom:16px;">&#128269;</div>
      <h3 style="color:var(--white);margin-bottom:8px;">Enter a search term</h3>
      <p style="color:var(--text-muted);">Find news from around the world</p>
    </div>
  </div>
</main>

<div id="footerWrap"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('headerWrap').innerHTML = buildHeader();
  document.getElementById('navWrap').innerHTML    = buildNav('/search.html');
  document.getElementById('footerWrap').innerHTML = buildFooter();
  const q = new URLSearchParams(window.location.search).get('q');
  if (q) {
    // XSS FIX: Sanitize the query before displaying
    document.getElementById('searchBox').value = q;
    search(q);
  }
});

function doSearchNow() {
  const q = document.getElementById('searchBox').value.trim();
  if (!q) return;
  window.history.replaceState({}, '', `/search.html?q=${encodeURIComponent(q)}`);
  search(q);
}

async function search(q) {
  // XSS FIX: Use textContent-safe display in title
  const safeQ = q.replace(/[<>"&]/g, '');
  document.title = `"${safeQ}" &mdash; SFAAM NEWS`;
  document.getElementById('resultsGrid').innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);"><div class="loading-spinner"></div><p style="margin-top:12px;">Searching...</p></div>`;
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}&per_page=24`);
    const arts = await r.json();
    document.getElementById('resultCount').textContent = arts.length ? `Found ${arts.length} result${arts.length !== 1 ? 's' : ''}` : 'No results found';
    if (!arts.length) {
      document.getElementById('resultsGrid').innerHTML = `<div class="news-card" style="grid-column:1/-1;padding:60px;text-align:center;"><div style="font-size:3rem;margin-bottom:16px;">&#128546;</div><h3 style="color:var(--white);margin-bottom:8px;">Nothing found for "${esc(safeQ)}"</h3><p style="color:var(--text-muted);">Try different keywords or browse by region</p><div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;"><a href="/category/world" style="padding:10px 20px;background:var(--bg-3);color:var(--text);border-radius:6px;font-weight:600;">&#127757; World</a><a href="/category/usa" style="padding:10px 20px;background:var(--bg-3);color:var(--text);border-radius:6px;font-weight:600;">&#127482;&#127480; USA</a><a href="/category/pakistan" style="padding:10px 20px;background:var(--bg-3);color:var(--text);border-radius:6px;font-weight:600;">&#127477;&#127472; Pakistan</a><a href="/category/india" style="padding:10px 20px;background:var(--bg-3);color:var(--text);border-radius:6px;font-weight:600;">&#127470;&#127475; India</a><a href="/category/germany" style="padding:10px 20px;background:var(--bg-3);color:var(--text);border-radius:6px;font-weight:600;">&#127465;&#127466; Germany</a></div></div>`;
    } else {
      document.getElementById('resultsGrid').innerHTML = arts.map(a => buildNewsCard(a)).join('');
    }
  } catch (e) {
    // Demo mode
    const demoArts = getDemoArticles('', 6).filter(a =>
      (a.title || '').toLowerCase().includes(q.toLowerCase()) ||
      (a.summary || '').toLowerCase().includes(q.toLowerCase())
    );
    document.getElementById('resultCount').textContent = demoArts.length ? `Found ${demoArts.length} results (demo mode)` : 'No results found';
    if (demoArts.length) {
      document.getElementById('resultsGrid').innerHTML = demoArts.map(a => buildNewsCard(a)).join('');
    } else {
      document.getElementById('resultsGrid').innerHTML = `<div class="news-card" style="grid-column:1/-1;padding:60px;text-align:center;"><div style="font-size:3rem;margin-bottom:16px;">&#128546;</div><h3 style="color:var(--white);margin-bottom:8px;">Nothing found</h3><p style="color:var(--text-muted);">Try different keywords</p></div>`;
    }
  }
}
</script>
</body>
</html>
