# ============================================
# SFAAM NEWS V29 - Railway Configuration
# Yeh file Railway ko batati hai ke app kaise
# build aur start hogi
# ============================================

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "bash start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
